name: whowolf_cli
description: Command-line Whowolf to host or join a room from a terminal, for tests and tinkering.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

executables:
  whowolf: whowolf

dependencies:
  game_core:
    path: ../game_core
  game_host:
    path: ../game_host
  protocol:
    path: ../protocol
  secure_channel:
    path: ../secure_channel

dev_dependencies:
  test: ^1.31.0
  very_good_analysis: 10.3.0

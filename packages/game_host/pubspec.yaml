name: game_host
description: Whowolf host logic (rooms, sessions, timers) behind a transport interface. Pure Dart; the LAN transport lives in lan.dart.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # SHA-1 for the WebSocket handshake by hand (lib/socket_guard.dart); a
  # dart.dev package, already used by the relay server.
  crypto: ^3.0.7
  game_core:
    path: ../game_core
  protocol:
    path: ../protocol
  # The browser's WebSocket (lib/browser.dart only), for players who join
  # without the app.
  web: ^1.1.1

dev_dependencies:
  test: ^1.31.0
  very_good_analysis: 10.3.0

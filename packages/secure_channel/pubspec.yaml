name: secure_channel
description: End-to-end encryption for Whowolf connections (Noise NN / NKpsk2 with 25519, ChaChaPoly, BLAKE2s). Pure Dart.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dev_dependencies:
  test: ^1.31.0
  very_good_analysis: 10.3.0
dependencies:
  game_host:
    path: ../game_host
  # libsodium bindings (Skycoder42, BSD-3/ISC); 4.1 needs Dart 3.13.
  sodium: 4.0.4

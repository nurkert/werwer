name: whowolf
description: Werewolf at the table. Everyone on their own phone.
publish_to: none
# Set by CI from the git tag (--build-name/--build-number); 0.0.x are pre-releases.
version: 0.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: 3.44.8

dependencies:
  bonsoir: 7.1.5
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  game_core:
    path: ../packages/game_core
  game_host:
    path: ../packages/game_host
  intl: any
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  protocol:
    path: ../packages/protocol
  qr_flutter: ^4.1.0
  # 1.8.1+ needs dbus 0.8, which bonsoir_linux does not support yet.
  secure_channel:
    path: ../packages/secure_channel
  wakelock_plus: ">=1.3.0 <1.8.1"

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/figures/
    - assets/sheep/
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf

# App icons for every platform from the emblem (dart run flutter_launcher_icons).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: '#141a33'
  android: true
  adaptive_icon_background: '#141a33'
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  macos:
    generate: true
    image_path: assets/icon/icon_macos.png
  windows:
    generate: true
    icon_size: 256
  linux:
    generate: true

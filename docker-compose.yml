# Self-hosted Whowolf relay: `docker compose up -d`.
# Players far away join a host through it; it forwards messages only and
# keeps no game data. Put a TLS reverse proxy (e.g. Caddy) in front of it
# and enter wss://your-domain in the app.
services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: whowolf-relay:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MAX_ROOMS: "200"
      MAX_PEERS: "24"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app/whowolf-relay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

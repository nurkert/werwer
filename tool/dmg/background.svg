<?xml version="1.0" encoding="UTF-8"?>
<!-- Background of the macOS disk image: the night stage of the app
     (docs/DESIGN.md). Moonlit sky, the wordmark on top, two plaques with a
     brass edge: Whowolf.app on the left, the free slot of Applications on the
     right (dashed), lantern chevrons pointing from one to the other.
     660 x 420 points. Finder places Whowolf.app at (170, 215) and the
     Applications link at (490, 215) with 112 pt icons (settings.py); its labels
     sit on the two brass name plates. Colours are design/tokens.json, type is
     Ancizar Serif and Manrope from app/assets/fonts.
     @FIRST_LAUNCH@ is filled in by render_background.sh (signed / unsigned).
     Rendered with tool/dmg/render_background.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16253b"/>
      <stop offset="0.55" stop-color="#08111d"/>
      <stop offset="1" stop-color="#060b14"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="330" cy="60" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9d89f" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#f9d89f" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f9d89f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171515" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#171515" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8a745"/>
      <stop offset="0.5" stop-color="#eb9032"/>
      <stop offset="1" stop-color="#d57622"/>
    </linearGradient>
  </defs>

  <!-- Sky and moonlight -->
  <rect width="660" height="420" fill="url(#sky)"/>
  <rect width="660" height="420" fill="url(#moonGlow)"/>

  <!-- Stars -->
  <g fill="#efdfbb">
    <circle cx="42" cy="38" r="1.1" opacity="0.7"/>
    <circle cx="96" cy="84" r="0.8" opacity="0.5"/>
    <circle cx="150" cy="30" r="1.3" opacity="0.8"/>
    <circle cx="188" cy="102" r="0.7" opacity="0.4"/>
    <circle cx="28" cy="132" r="0.9" opacity="0.45"/>
    <circle cx="482" cy="34" r="1.2" opacity="0.75"/>
    <circle cx="540" cy="92" r="0.8" opacity="0.5"/>
    <circle cx="604" cy="46" r="1.4" opacity="0.8"/>
    <circle cx="630" cy="120" r="0.8" opacity="0.4"/>
    <circle cx="568" cy="18" r="0.7" opacity="0.45"/>
  </g>
  <g fill="#f9d89f">
    <path d="M 118 58 l 1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 z" opacity="0.85"/>
    <path d="M 574 70 l 1.3 3.4 3.4 1.3 -3.4 1.3 -1.3 3.4 -1.3 -3.4 -3.4 -1.3 3.4 -1.3 z" opacity="0.75"/>
  </g>

  <!-- Hills behind the footer -->
  <path d="M 0 338 C 90 314 170 330 250 322 C 340 312 420 334 510 320 C 570 311 620 318 660 326 L 660 420 L 0 420 Z" fill="#0e1a2c" opacity="0.9"/>

  <!-- Wordmark -->
  <image x="212" y="18" width="236" height="93.6" xlink:href="wordmark.png" href="wordmark.png"/>

  <!-- Left plaque: the app, brass edge lit by the lantern -->
  <rect x="86.5" y="146.5" width="167" height="175" rx="18" fill="url(#plaque)" stroke="#5e513f" stroke-width="1"/>
  <rect x="90.5" y="150.5" width="159" height="167" rx="14" fill="none" stroke="#eb9032" stroke-opacity="0.55" stroke-width="1"/>
  <!-- Right plaque: the free slot of Applications, dashed brass -->
  <rect x="406.5" y="146.5" width="167" height="175" rx="18" fill="#171515" fill-opacity="0.38" stroke="#5e513f" stroke-width="1"/>
  <rect x="410.5" y="150.5" width="159" height="167" rx="14" fill="none" stroke="#c7a172" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Brass name plates under Finder's labels. Finder draws them black in
       light mode and white in dark mode; this brass (relative luminance 0.20)
       holds both at about 4.2:1 or more. -->
  <rect x="113" y="277" width="114" height="22" rx="11" fill="#987552"/>
  <rect x="433" y="277" width="114" height="22" rx="11" fill="#987552"/>

  <!-- Lantern chevrons brightening towards the slot -->
  <line x1="268" y1="215.5" x2="392" y2="215.5" stroke="#23344c" stroke-width="1"/>
  <g fill="none" stroke="url(#lantern)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 303 207 L 311 215.5 L 303 224" stroke-opacity="0.35"/>
    <path d="M 325 207 L 333 215.5 L 325 224" stroke-opacity="0.65"/>
    <path d="M 347 207 L 355 215.5 L 347 224" stroke-opacity="1"/>
  </g>
  <text x="330" y="250" font-family="Ancizar Serif, AncizarSerif, Georgia, serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#e6d2ae" text-anchor="middle">DRAG TO INSTALL</text>

  <!-- Footer: first launch and the facts -->
  <rect x="0" y="356" width="660" height="64" fill="#060b14" fill-opacity="0.82"/>
  <line x1="0" y1="356.5" x2="660" y2="356.5" stroke="#5e513f" stroke-opacity="0.8"/>
  <g font-family="Manrope, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="330" y="383" font-size="11.5" font-weight="600" fill="#e6d2ae">@FIRST_LAUNCH@</text>
    <text x="330" y="403" font-size="10.5" font-weight="400" fill="#a28070">Free and open source · Apple silicon and Intel · Apache-2.0 · whowolf.de</text>
  </g>
</svg>

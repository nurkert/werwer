# Flatpak manifest: wraps the prebuilt Flutter Linux bundle (tool/package_flatpak.sh
# copies it to bundle/ next to this file). The freedesktop runtime brings GTK,
# Mesa, libsecret and GStreamer.
app-id: de.whowolf.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: whowolf
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Hosting and joining games in the local network (and via a relay).
  - --share=network
  # The narrator and the night sounds.
  - --socket=pulseaudio
  # The session keys live in the desktop's keyring (libsecret).
  - --talk-name=org.freedesktop.secrets
modules:
  - name: whowolf
    buildsystem: simple
    sources:
      - type: dir
        path: bundle
        dest: bundle
      - type: dir
        path: linux
        dest: linux
    build-commands:
      - mkdir -p /app/lib/whowolf /app/bin
      - cp -a bundle/. /app/lib/whowolf/
      - ln -s /app/lib/whowolf/whowolf /app/bin/whowolf
      - bash linux/install_share.sh /app

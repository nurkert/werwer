publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  protocol:
    path: ../packages/protocol

dev_dependencies:
  game_core:
    path: ../packages/game_core
  game_host:
    path: ../packages/game_host
  test: ^1.31.0
  very_good_analysis: 10.3.0

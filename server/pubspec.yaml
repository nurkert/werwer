name: whowolf_server
description: Whowolf relay server. Forwards messages between remote players and a host; no game logic, no game state.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.7
  # The guarded WebSocket (lib/socket_guard.dart), shared with the LAN host.
  game_host:
    path: ../packages/game_host
  protocol:
    path: ../packages/protocol

dev_dependencies:
  game_core:
    path: ../packages/game_core
  # For the browser test's VM side (spawnHybridUri), part of package:test.
  stream_channel: ^2.1.4
  test: ^1.31.0
  very_good_analysis: 10.3.0

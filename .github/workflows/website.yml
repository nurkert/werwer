name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'design/source/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  # New releases appear on the download page automatically.
  release:
    types: [published]
  # Weekly rebuild picks up changes to the externally hosted imprint.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: read the repo, deploy to Pages via OIDC, nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          # Read-only token, only to avoid API rate limits when listing releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The imprint lives on the owner's site, not in the repo. Forks set their own repo variable.
          IMPRINT_URL: ${{ github.repository == 'nurkert/whowolf' && 'https://nurkert.de/impressum' || vars.IMPRINT_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Pre-release

# Push a tag like v0.0.3 to build every platform and publish a GitHub pre-release.
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.0.3'
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          cache: true
      - run: tool/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Version
        run: |
          version="${VERSION#v}"
          echo "NAME=$version" >> "$GITHUB_ENV"
          echo "FLAGS=--release --build-name=$version --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        run: |
          mkdir -p ../dist
          case "${{ matrix.target }}" in
            android)
              # Pre-releases are signed with the debug key until a release keystore is configured.
              flutter build apk $FLAGS
              cp build/app/outputs/flutter-apk/app-release.apk "../dist/whowolf-$NAME-android.apk" ;;
            linux)
              flutter build linux $FLAGS
              tar -czf "../dist/whowolf-$NAME-linux-x64.tar.gz" -C build/linux/x64/release/bundle . ;;
            windows)
              flutter build windows $FLAGS
              (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/whowolf-$NAME-windows-x64.zip" . >/dev/null) ;;
            macos)
              # Unsigned until Developer ID signing and notarization secrets are configured.
              flutter build macos $FLAGS
              ditto -c -k --keepParent build/macos/Build/Products/Release/Whowolf.app "../dist/whowolf-$NAME-macos.zip" ;;
            ios)
              # Compile check only; iPhone builds are distributed via TestFlight, not as a download.
              flutter build ios $FLAGS --no-codesign ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target != 'ios'
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
      actions: write # trigger the website rebuild
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" dist/* --prerelease --generate-notes --title "Whowolf ${tag#v} (pre-release)" --target "${{ github.sha }}"
      - name: Rebuild the website download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Releases created with GITHUB_TOKEN do not trigger other workflows, so start it explicitly.
        run: gh workflow run website.yml --ref main

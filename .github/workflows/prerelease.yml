name: Pre-release

# Push a tag like v0.0.3 to build every platform and publish a GitHub pre-release.
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.0.3'
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: tool/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_KEY: ${{ secrets.ASC_KEY_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Version
        run: |
          version="${VERSION#v}"
          # Only a plain version number goes into the environment of later steps.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.1.0, got: $version"; exit 1
          fi
          echo "NAME=$version" >> "$GITHUB_ENV"
          echo "FLAGS=--release --build-name=$version --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Web app for joining in the browser
        # Bundled into the app: the host's phone serves it on the local
        # network (tool/build_webapp.sh, app/assets/webapp/README.md).
        env:
          APP_VERSION: ${{ env.NAME }}
        run: tool/build_webapp.sh
      - name: Web app for relay servers
        # The same web build as one release file; relay images serve it to
        # browsers that join over the internet (tool/fetch_webapps.sh).
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          tool/package_webapp.sh "$NAME" "dist/whowolf-$NAME-webapp.tar.gz"
          # It must start in Chrome under exactly the relay's headers.
          tool/verify_webapp.sh "dist/whowolf-$NAME-webapp.tar.gz"
      - name: Signed Apple build
        # With the App Store Connect key in the repository secrets, macOS is
        # signed with Developer ID and notarized, and iOS goes to TestFlight.
        # Without them the unsigned build below runs instead.
        id: apple
        if: (matrix.target == 'macos' || matrix.target == 'ios') && env.HAS_APPLE_KEY == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: tool/apple_release.sh "${{ matrix.target }}" "$NAME" "${{ github.run_number }}"
      - name: Build
        if: steps.apple.outcome != 'success'
        working-directory: app
        run: |
          mkdir -p ../dist
          case "${{ matrix.target }}" in
            android)
              # Pre-releases are signed with the debug key until a release keystore is configured.
              flutter build apk $FLAGS
              cp build/app/outputs/flutter-apk/app-release.apk "../dist/whowolf-$NAME-android.apk" ;;
            linux)
              flutter build linux $FLAGS
              ../tool/package_deb.sh "$NAME" build/linux/x64/release/bundle "../dist/whowolf-$NAME-linux-amd64.deb" ;;
            windows)
              flutter build windows $FLAGS
              (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/whowolf-$NAME-windows-x64.zip" . >/dev/null) ;;
            macos)
              # Unsigned: the repository has no App Store Connect key yet.
              flutter build macos $FLAGS
              ditto -c -k --keepParent build/macos/Build/Products/Release/Whowolf.app "../dist/whowolf-$NAME-macos.zip" ;;
            ios)
              # Compile check only; iPhone builds are distributed via TestFlight, not as a download.
              flutter build ios $FLAGS --no-codesign ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target != 'ios'
        with:
          name: app-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  relay:
    # The relay server's container image, for play.whowolf.de and anyone who
    # hosts their own: built here, signed keylessly (Sigstore) and attested,
    # so a server only runs what this workflow built (server/deploy/update.sh).
    # After the release, so the image carries this release's web app.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signature and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.1.0, got: $version"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whowolf-relay"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          # Test versions (0.0.x) never become the image servers follow.
          tags="$image:$version"
          case "$version" in 0.0.*) tags="$tags,$image:edge" ;; *) tags="$tags,$image:stable" ;; esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - name: Web app builds
        # Every build in server/webapps.lock and this release's, each checked
        # against its checksum and this repository's build attestation.
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/fetch_webapps.sh "$VERSION"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Whowolf relay server (forwards encrypted messages, no game logic)
            org.opencontainers.image.licenses=Apache-2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
      actions: write # trigger the website rebuild
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Only the app builds, not e.g. the relay image's build record.
          pattern: app-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # 0.0.x are test versions (pre-releases); from 0.1 on a release is a real one, still marked
        # as developer beta until the security review is done.
        run: |
          tag="v${VERSION#v}"
          cat > notes.md <<'NOTES'
          **Developer beta.** Playable with friends in your own Wi-Fi (or through your own relay server, see docker-compose.yml), end-to-end encrypted. Give every device at the table the same version, and only play with people you trust: an independent security review is still due. See CHANGELOG.md; bug reports welcome in the issues.

          **Opening the builds.** They are not signed by Apple or Microsoft yet:
          - **macOS:** open the `.zip`, then right-click Whowolf → Open → Open (only the first time).
          - **Windows:** unpack the `.zip` and start `whowolf.exe`; at "Windows protected your PC" choose More info → Run anyway.
          - **Android:** allow installing apps from your browser or file manager when asked.
          - **Linux:** `sudo apt install ./whowolf-*-linux-amd64.deb`.
          - **iPhone:** via TestFlight as soon as it is set up.

          Check a download against `SHA256SUMS.txt`, or verify its build provenance with `gh attestation verify <file> --repo nurkert/whowolf`.
          NOTES
          case "${tag#v}" in
            0.0.*) gh release create "$tag" dist/* --prerelease --title "Whowolf ${tag#v} (test version)" --target "${{ github.sha }}" --notes-file notes.md --generate-notes ;;
            *) gh release create "$tag" dist/* --latest --title "Whowolf ${tag#v} (developer beta)" --target "${{ github.sha }}" --notes-file notes.md --generate-notes ;;
          esac
      - name: Rebuild the website download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Releases created with GITHUB_TOKEN do not trigger other workflows, so start it explicitly.
        run: gh workflow run website.yml --ref main
